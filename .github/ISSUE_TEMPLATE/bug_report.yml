name: Bug report
description: Report a defect in analysis, UI, or packaging
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please include enough detail to reproduce.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Local web, Docker, or deployed? Include versions if known.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Value from VERSION / UI header
      placeholder: "1.5.1"
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Logs, screenshots, nuclease, OS — omit proprietary sequences if possible
